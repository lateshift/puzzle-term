<!-- Development-only lifecycle probe: default builds and packages never copy this page. -->
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>Puzzle lifecycle probe — no WebDriver</title>
  <link data-trunk rel="rust" data-wasm-opt="3" href="../../crates/puzzle-web/Cargo.toml">
  <link data-trunk rel="copy-file" href="../../assets/fonts/JetBrainsMono-Variable.ttf">
  <link data-trunk rel="copy-file" href="../../assets/fonts/JetBrainsMono-Italic-Variable.ttf">

  <style>
    body { background: #808080; color: white; font: 16px system-ui; }
    #terminal { width: 800px; height: 480px; }
    input { width: 600px; }
  </style>
</head>
<body>
  <h1>Development lifecycle probe (normal Chrome, no WebDriver)</h1>
  <p><output id="cycles">0 / 200 — loading</output></p>
  <form id="start">
    <label>Private local bridge URL <input id="bridge" type="url" required autocomplete="off"></label>
    <button>Run 200 cycles</button>
  </form>
  <div id="terminal"></div>
  <script type="module" src="browser-stress.js"></script>
</body>
</html>
