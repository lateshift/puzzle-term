[workspace]
resolver = "3"
members = ["crates/*", "xtask"]

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.97"
license = "MIT"

[workspace.dependencies]
wgpu = { version = "=30.0.1", default-features = false }
bytemuck = { version = "1.25", features = ["derive"] }
wasm-bindgen = "=0.2.127"
js-sys = "=0.3.104"
web-sys = "=0.3.104"
wasm-bindgen-futures = "=0.4.77"
wasm-bindgen-test = "=0.3.77"
web-time = "1.1"
console_error_panic_hook = "0.1.7"
tracing = "0.1.44"
tracing-subscriber = { version = "0.3.23", default-features = false, features = ["fmt", "std", "ansi"] }
tracing-web = "0.1.3"
thiserror = "2.0"
winit = "0.30"
portable-pty = "0.9"
# R4 user approval 2026-10-10: safe Unix master duplication; already in Cargo.lock.
filedescriptor = "=0.8.3"
arboard = { version = "3.6.1", default-features = false }
# D-37: only puzzle-desktop decodes embedded bitmap emoji PNGs.
png = "=0.18.1"
# R4 user approval: only the native image worker links zlib decompression.
flate2 = "=1.1.10"
# D-37 + user 2026-10-04: discovery only; read-fonts 0.41 stays desktop-only.
fontique = "=0.11.1"
# User 2026-10-07: safe diagnostic thread-CPU timing, never shared/wasm.
rustix = { version = "=1.1.5", default-features = false, features = ["std", "time"] }
# R4 (2026-10-11): harness-only safe clipboard revision reads.
objc2-app-kit = { version = "=0.3.2", default-features = false, features = ["std", "NSPasteboard"] }
# R4/D-60 2026-10-17: IOSurface-backed native presentation; sys/macOS only.
objc2 = { version = "=0.6.4", default-features = false, features = ["std"] }
block2 = { version = "=0.6.2", default-features = false, features = ["std"] }
objc2-io-surface = { version = "=0.3.2", default-features = false, features = ["std", "IOSurfaceRef", "IOSurfaceTypes", "libc", "objc2", "objc2-core-foundation"] }
objc2-core-foundation = { version = "=0.3.2", default-features = false, features = ["std", "CFBase", "CFDictionary", "CFNumber", "CFString"] }
objc2-metal = { version = "=0.3.2", default-features = false, features = ["std", "MTLDevice", "MTLTexture", "MTLResource", "MTLPixelFormat", "MTLTypes", "MTLCommandQueue", "MTLCommandBuffer", "objc2-io-surface", "block2"] }
# R4 2026-10-11: explicit native compositor sRGB, already locked through wgpu.
objc2-core-graphics = { version = "=0.3.2", default-features = false, features = ["std", "CGColorSpace"] }
# D-54: layer-gravity bindings are confined to puzzle-sys on macOS.
objc2-quartz-core = { version = "=0.3.2", default-features = false, features = ["std", "CALayer", "CAMetalLayer", "CATransaction", "objc2-core-foundation"] }
# D-53: macOS display-link bindings are confined to puzzle-sys.
objc2-core-video = { version = "=0.3.2", default-features = false, features = ["std", "CVBase", "CVReturn", "CVHostTime", "CVDisplayLink", "objc2-core-graphics"] }
bitflags = "2"
proptest = "1.11"
allocation-counter = "0.8"
kurbo = "0.13"
divan = "0.1.21"
skrifa = { version = "0.46", default-features = false, features = ["std"] }
harfrust = { version = "=0.13.0", default-features = false, features = ["std"] }
rustc-hash = "2.1"
smallvec = "1.15"
unicode-segmentation = "1.13"
unicode-width = "0.2.2"
vte = { version = "0.15", default-features = false }
insta = "1.48"
serde_json = "1"
tokio = { version = "1", default-features = false, features = ["rt-multi-thread", "net", "sync", "time", "macros", "signal"] }
tokio-tungstenite = { version = "0.30", default-features = false, features = ["handshake"] }
getrandom = "=0.3.4"
futures-util = { version = "0.3", default-features = false, features = ["std", "sink"] }
# R4, user 2026-10-13: established authentication family, optional protocol only.

[workspace.lints.rust]
unsafe_code = "deny"
missing_docs = "deny"
unreachable_pub = "warn"

[workspace.lints.clippy]
all = { level = "deny", priority = -1 }
missing_docs_in_private_items = "deny"
too_many_lines = "deny"
unwrap_used = "deny"
expect_used = "deny"
dbg_macro = "deny"
print_stdout = "deny"
print_stderr = "deny"
todo = "deny"
unimplemented = "deny"
allow_attributes_without_reason = "deny"

[profile.dev.package."*"]
opt-level = 2

[profile.release]
opt-level = 3
lto = "fat"
codegen-units = 1
panic = "abort"

[profile.live]
inherits = "release"
lto = false
incremental = true
debug = "line-tables-only"

[profile.bench]
inherits = "release"
debug = "line-tables-only"
