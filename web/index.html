<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Puzzle Terminal</title>
  <link data-trunk rel="rust" data-wasm-opt="3" href="../crates/puzzle-web/Cargo.toml">
  <link data-trunk rel="copy-file" href="../assets/fonts/JetBrainsMono-Variable.ttf">
  <link data-trunk rel="copy-file" href="../assets/fonts/JetBrainsMono-Italic-Variable.ttf">
  <link data-trunk rel="copy-file" href="../assets/fonts/SymbolsNerdFontMono-Regular.ttf">
  <link data-trunk rel="copy-file" href="../assets/fontpacks/jetbrains-regular.pzfp">
  <link data-trunk rel="copy-file" href="../assets/fontpacks/jetbrains-bold.pzfp">
  <link data-trunk rel="copy-file" href="../assets/fontpacks/jetbrains-italic.pzfp">
  <link data-trunk rel="copy-file" href="../assets/fontpacks/jetbrains-bold-italic.pzfp">
  <link data-trunk rel="copy-file" href="demo.js">
  <link rel="preload" href="jetbrains-regular.pzfp" as="fetch" crossorigin>
  <link rel="preload" href="JetBrainsMono-Variable.ttf" as="fetch" crossorigin>
  <style>
    html, body { margin: 0; min-height: 100%; background: #808080; }
    body { padding: 24px; box-sizing: border-box; }
    canvas { display: block; }
    /* Historical GPU specimens appear only on their explicit ?scene= review pages. */
    #puzzle-canvas { display: none; }
    #puzzle-error { color: #5b0000; background: #fff; padding: 12px; max-width: 776px; }
    #terminal { width: 100%; height: 65vh; min-height: 320px; }
    #bridge-url { width: min(650px, 70vw); }
  </style>
</head>
<body>
  <canvas id="puzzle-canvas" aria-label="Puzzle Terminal" data-puzzle-state="loading"></canvas>
  <p id="puzzle-error" role="alert" hidden></p>
  <div id="terminal" aria-label="Puzzle Terminal"></div>
  <form id="search" role="search">
    <label>Find in scrollback <input id="search-query" type="search" autocomplete="off"></label>
    <label><input id="search-case" type="checkbox"> Match case</label>
    <button type="submit">Find</button>
    <button id="search-prev" type="button">Previous</button>
    <button id="search-next" type="button">Next</button>
    <button id="search-clear" type="button">Clear</button>
    <output id="search-count" aria-live="polite"></output>
  </form>
  <p id="status" role="status">Loading the terminal engine…</p>
  <form id="connect">
    <label>Connect to bridge (local development tool only)
      <input id="bridge-url" type="url" autocomplete="off" spellcheck="false" required
             placeholder="ws://127.0.0.1:7681/pty?token=…">
    </label>
    <button type="submit">Connect</button>
    <button id="disconnect" type="button">Disconnect</button>
    <button id="fullscreen" type="button">Fullscreen + keyboard lock</button>
  </form>
  <details><summary>About / credits</summary>
    <p>Puzzle Terminal is MIT licensed. Slug reference shaders © Eric Lengyel,
       MIT / Apache-2.0. JetBrains Mono and Symbols Nerd Font Mono: OFL 1.1.</p>
  </details>
  <script type="module" src="demo.js"></script>
</body>
</html>
