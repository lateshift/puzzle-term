[package]
name = "puzzle-web"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true

[lib]
crate-type = ["cdylib", "rlib"]

[features]
# Cargo features are additive, so a verbose release opts out of this default.
default = ["release-info"]
release-info = ["tracing/release_max_level_info"]
verbose-logs = ["tracing/release_max_level_debug"]
# Review URLs compile deterministic scenes; the shipped wasm leaves them out.
review-scenes = ["puzzle-term/test-scenes"]
# Explicit development benchmark page; corpus/font fixtures never enter normal builds.
measurements = ["puzzle-term/test-scenes"]

[target.'cfg(target_arch = "wasm32")'.dependencies]
puzzle-render = { path = "../puzzle-render" }
puzzle-term = { path = "../puzzle-term" }
wgpu = { workspace = true, features = ["webgpu", "wgsl"] }
wasm-bindgen.workspace = true
wasm-bindgen-futures.workspace = true
js-sys.workspace = true
web-sys = { workspace = true, features = ["Window", "Document", "Element", "HtmlCanvasElement", "Location", "UrlSearchParams", "Response", "HtmlElement", "HtmlTextAreaElement", "Node", "Event", "EventInit", "EventTarget", "KeyboardEvent", "KeyboardEventInit", "InputEvent", "InputEventInit", "CompositionEvent", "CompositionEventInit", "ClipboardEvent", "ClipboardEventInit", "DataTransfer", "PointerEvent", "PointerEventInit", "MouseEvent", "MouseEventInit", "WheelEvent", "WheelEventInit", "AddEventListenerOptions", "CssStyleDeclaration", "Navigator", "Clipboard", "ClipboardItem", "Blob", "BlobPropertyBag", "DomRect", "DomRectReadOnly", "ResizeObserver", "ResizeObserverEntry", "ResizeObserverOptions", "ResizeObserverBoxOptions", "MediaQueryList", "MediaQueryListEvent", "WebSocket", "BinaryType", "MessageEvent", "MessageEventInit", "MessageChannel", "MessagePort", "CanvasRenderingContext2d", "ImageData", "OffscreenCanvas", "OffscreenCanvasRenderingContext2d", "TextMetrics"] }
web-time.workspace = true
console_error_panic_hook.workspace = true
tracing.workspace = true
tracing-subscriber.workspace = true
tracing-web.workspace = true

[target.'cfg(target_arch = "wasm32")'.dev-dependencies]
# The exact native measurement fixture is reused only by browser witnesses.
puzzle-term = { path = "../puzzle-term", features = ["test-scenes"] }
wasm-bindgen-test.workspace = true

[lints]
workspace = true
